{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

<div class="auth-page">
<div class="auth-card">

<h2>Forgot Password</h2>

<p>Enter your registered email.</p>

<form method="POST">

<div class="form-group">
<label>Email</label>

<input
type="email"
name="email"
required>

</div>

<button class="btn-primary btn-full">
Send Reset Link
</button>

</form>

</div>
</div>

{% endblock %}
